services:
  - type: web
    name: intellidata-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false   # set manually in the Render dashboard -- never commit it
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: APP_ENV
        value: production
